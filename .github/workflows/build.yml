permissions:
  contents: read
  packages: write
on:
  schedule:
    - cron: "0 0 * * 0" # Runs weekly at midnight UTC
  push:
    branches:
      - main
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v7
      # https://github.com/marketplace/actions/docker-setup-docker
      - uses: docker/setup-docker-action@v5
      # login to github, build and push image
      - name: Build and push image
        run: |
          docker build -t ghcr.io/codabool/rssedit .
          echo ${{ secrets.GH_TOKEN }} | docker login ghcr.io -u codabool --password-stdin
          docker push ghcr.io/codabool/rssedit
